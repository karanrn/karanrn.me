# Rendered in this order on /games/. Source covers live in assets/images/games/<image>.
# To add a game, add a `- title:` entry and run `make covers`: it fills in `image:` and
# downloads the cover (Steam, else Wikipedia). If it picks the wrong cover, delete the
# image file, set `steam_id:` (from the store URL) or `cover_url:`, and run it again.
# Optional fields:
#   rating:   0.5–5 in steps of 0.5, shown as stars (e.g. 3.5 → ★★★½); omit if unrated
#   status:   playing | stopped, shown under the cover
#   note:     with status: stopped, shown under "stopped" (e.g. "chapter 7");
#             otherwise shown on hover via the ≡ icon
#   favorite: true to also show it in the "favorite games" row at the top (4 fit per row)
