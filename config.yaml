baseURL: 'https://karanrn.me/'
languageCode: 'en-us'
title: 'karanrn.me'
theme: "hugo-book"

# Book configuration
disablePathToLower: true
enableGitInfo: false
disableKinds:
  - taxonomy
  - term

copyright: "Copright %copy; 2026, Karan Nadagoudar"

permalinks:
  posts: /posts/:filename/

params:
  author: "Karan Nadagoudar"
  description: "Karan Nadagoudar is a platform engineer at Nutanix, writing about technology and lessons from life."
  # Default link-preview image; a page can override it with `image:` in front matter.
  ogImage: "/images/og-default.jpg"
  BookTheme: "light"
  BookToC: false
  BookRepo: https://github.com/karanrn/karanrn.me
  BookSearch: true

menu:
  after:
  - name: movies
    url: https://letterboxd.com/karan4080/
    weight: 110

markup:
  goldmark:
    renderer:
      unsafe: true

enableRobotsTXT: true
